<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>CR Tracker</title>

<style>

body{
font-family:sans-serif;
background:#0f172a;
color:white;
padding:10px
}

table{
width:100%;
border-collapse:collapse;
background:#1e293b
}

th,td{
padding:8px;
border:1px solid #334155
}

th{
background:#ef4444
}

.win{color:#22c55e}
.loss{color:#f87171}

</style>

</head>

<body>

<h2>Clash Royale Tracker</h2>

<table>

<thead>

<tr>

<th>Player</th>
<th>Total</th>
<th>W/L/D</th>
<th>Top Units</th>
<th>Top Spells</th>
<th>Top Buildings</th>
<th>Last Match</th>

</tr>

</thead>

<tbody id="body">

</tbody>

</table>

<script>

async function load(){

const r=await fetch("./Data/summary.json?v="+Date.now())

const data=await r.json()

let html=""

data.forEach(p=>{

html+=`

<tr>

<td>${p.name}</td>

<td>${p.total}</td>

<td>
<span class="win">${p.win}</span> /
<span class="loss">${p.loss}</span> /
${p.draw}
</td>

<td>${p.top_units}</td>

<td>${p.top_spells}</td>

<td>${p.top_buildings}</td>

<td>${p.last_match}</td>

</tr>

`

})

document.getElementById("body").innerHTML=html

}

load()

</script>

</body>
</html>
