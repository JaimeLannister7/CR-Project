<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR Tracker Live Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: white; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #16213e; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; border: 1px solid #0f3460; text-align: center; }
        th { background: #e94560; }
        h1 { color: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Clash Royale Tracker</h1>
        <p>প্রতি ২ ঘণ্টা পর পর অটোমেটিক আপডেট হয়।</p>
        <table id="statsTable">
            <thead>
                <tr>
                    <th>Player Name</th>
                    <th>Total Matches Played</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <script>
        async function loadStats() {
            const response = await fetch('./Data/summary.json');
            const data = await response.json();
            const tableBody = document.getElementById('tableBody');
            
            tableBody.innerHTML = '';
            data.forEach(player => {
                const row = `<tr>
                    <td>${player.name}</td>
                    <td>${player.total_matches}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }
        loadStats();
    </script>
</body>
</html>
