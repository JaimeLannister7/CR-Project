<!DOCTYPE html>
<html>
<head>
    <title>CR Tracker Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: white; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #16213e; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; border: 1px solid #0f3460; text-align: left; }
        th { background: #e94560; color: white; }
        tr:nth-child(even) { background: #1a1a2e; }
        h1 { color: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Clash Royale Live Stats</h1>
        <p>অটোমেশন প্রতি ২ ঘণ্টা পর পর এই টেবিলটি আপডেট করবে।</p>
        <div id="stats-table">Loading data...</div>
    </div>

    <script>
        // এখানে আপনার গিটহাবের ডেটা থেকে টেবিল তৈরি করার স্ক্রিপ্ট থাকবে
        document.getElementById('stats-table').innerHTML = "<p style='color: #f1c40f;'>ডেটা প্রসেসিং হচ্ছে... প্রথম ২ ঘণ্টার রান শেষ হলে এখানে টেবিল দেখা যাবে।</p>";
    </script>
</body>
</html>
