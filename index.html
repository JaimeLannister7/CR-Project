<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR Pro Tracker v2</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 5px; font-size: 12px; }
        .container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; }
        th, td { padding: 8px; border: 1px solid #334155; text-align: left; }
        th { background: #ef4444; color: white; text-align: center; }
        .win { color: #22c55e; font-weight: bold; }
        .loss { color: #f87171; font-weight: bold; }
        .time { color: #38bdf8; font-size: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>CR Pro Tracker</h2>
        <table id="mainTable">
            <thead>
                <tr>
                    <th>Player & Last Match</th>
                    <th>Total (W/L/D)</th>
                    <th>Streak</th>
                    <th>Highest Rivals</th>
                    <th>Top Cards (U/S/B)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <script>
        async function load() {
            const r = await fetch('./Data/summary.json?v=' + Date.now());
            const data = await r.json();
            const body = document.getElementById('tableBody');
            body.innerHTML = '';
            data.forEach(p => {
                body.innerHTML += `<tr>
                    <td><strong>${p.name}</strong><br><span class="time">Last: ${p.last_match}</span></td>
                    <td>${p.total}<br>(<span class="win">${p.win}</span>/<span class="loss">${p.loss}</span>/${p.draw})</td>
                    <td>W:${p.w_s}<br>L:${p.l_s}</td>
                    <td style="font-size:10px">
                        P: ${p.h_played}<br>W: ${p.h_win}<br>L: ${p.h_loss}
                    </td>
                    <td style="font-size:10px">
                        <strong>U:</strong> ${p.top_units}<br>
                        <strong>S:</strong> ${p.top_spells}<br>
                        <strong>B:</strong> ${p.top_buildings}
                    </td>
                </tr>`;
            });
        }
        load();
    </script>
</body>
</html>
